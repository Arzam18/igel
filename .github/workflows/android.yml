name: Build Igel Android ARM64

on:
  workflow_dispatch:
    inputs:
      uci_date:
        description: "UCI build identity date (YYYYMMDD)"
        required: true
        type: string
        default: "20261126"
      network_url:
        description: "Igel 3.8.10 compatible NNUE network URL"
        required: true
        type: string
        default: "https://github.com/vshcherbyna/igel/releases/download/0.8/820573bc.universal"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: NEON
            march: armv8-a+simd
            dotprod: OFF
            artifact: igel-3.8.10-android-arm64-neon
          - variant: NEON-Dotprod
            march: armv8.2-a+dotprod
            dotprod: ON
            artifact: igel-3.8.10-android-arm64-dotprod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Android NDK r27c (pinned and checksum-verified)
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/android-ndk-r27c-linux.zip"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip \
            --output "$ZIP"
          echo "090e8083a715fdb1a3e402d0763c388abb03fb4e  $ZIP" | sha1sum --check --status
          unzip -q "$ZIP" -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r27c" >> "$GITHUB_ENV"
          cmake --version
          ninja --version

      - name: Validate inputs and download Igel 3.8.10 network
        env:
          UCI_DATE: ${{ inputs.uci_date }}
          NETWORK_URL: ${{ inputs.network_url }}
        run: |
          set -euo pipefail
          if ! [[ "$UCI_DATE" =~ ^[0-9]{8}$ ]]; then
            echo "::error::uci_date must use YYYYMMDD format"
            exit 1
          fi
          curl --fail --location --retry 3 "$NETWORK_URL" --output network_file
          test -s network_file
          sha256sum network_file | tee network_file.sha256

      - name: Configure Android ARM64
        env:
          BUILD_DATE: ${{ inputs.uci_date }}
        run: |
          set -euo pipefail
          VARIANT_DIR="build-${{ matrix.variant }}"
          cmake -S . -B "$VARIANT_DIR" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DEVALFILE="$GITHUB_WORKSPACE/network_file" \
            -D_BTYPE=0 \
            -DUSE_DOTPROD=${{ matrix.dotprod }} \
            -DCMAKE_C_FLAGS="-march=${{ matrix.march }}" \
            -DCMAKE_CXX_FLAGS="-march=${{ matrix.march }} -mtune=cortex-a76 -DIGEL_BUILD_DATE=\"-${BUILD_DATE}\"" \
            -DCMAKE_VERBOSE_MAKEFILE=ON
          grep -E 'CMAKE_CXX_COMPILER:FILEPATH|CMAKE_CXX_COMPILER:STRING|ANDROID_ABI|ANDROID_PLATFORM' "$VARIANT_DIR/CMakeCache.txt" || true

      - name: Build engine
        run: |
          set -euo pipefail
          cmake --build "build-${{ matrix.variant }}" --target igel --parallel "$(nproc)" --verbose 2>&1 | tee "build-${{ matrix.variant }}.log"

      - name: Verify Android ARM64 binary and ISA
        run: |
          set -euo pipefail
          BIN="build-${{ matrix.variant }}/igel"
          test -s "$BIN"
          file "$BIN"
          readelf -h "$BIN" | grep -q 'Class:.*ELF64'
          readelf -h "$BIN" | grep -q 'Machine:.*AArch64'
          if readelf -d "$BIN" | grep -q 'libc++_shared.so'; then
            echo "::error::Unexpected shared libc++ dependency"
            exit 1
          fi
          strings "$BIN" | grep -Fq "3.8.10-${{ inputs.uci_date }}"
          strings "$BIN" | grep -Fq "ARM64 NEON"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump" -d "$BIN" > "$BIN.disasm"
          if [[ "${{ matrix.dotprod }}" == "ON" ]]; then
            grep -Eiq '\bsdot\b' "$BIN.disasm" || { echo "::error::SDOT instruction not found"; exit 1; }
          else
            grep -Eiq '\b(add|sub|smax|smin|smull|smlal|sqadd|sqsub)[[:alnum:]]*\b' "$BIN.disasm" || { echo "::error::Expected NEON arithmetic not found"; exit 1; }
            if grep -Eiq '\bsdot\b' "$BIN.disasm"; then
              echo "::error::Baseline NEON binary unexpectedly contains SDOT"
              exit 1
            fi
          fi
          mkdir -p artifact
          cp "$BIN" "artifact/${{ matrix.artifact }}"
          chmod +x "artifact/${{ matrix.artifact }}"
          sha256sum "artifact/${{ matrix.artifact }}" > "artifact/${{ matrix.artifact }}.sha256"
          cp network_file.sha256 artifact/

      - name: Upload engine-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact/*
          if-no-files-found: error
