name: Igel Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-24" "ndk;27.2.12479018"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Download Igel NNUE network
        run: |
          curl -L --fail --retry 3 \
            https://github.com/vshcherbyna/igel/releases/download/0.8/6b953e78.standard \
            -o network_file
          test -s network_file
          sha256sum network_file

      - name: Configure Android ARM64 NEON build
        run: |
          ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -d "$ANDROID_NDK"

          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK" \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_API=24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DEVALFILE="$PWD/network_file" \
            -DUSE_NEON=1 \
            -D_BTYPE=0 \
            -DSYZYGY_SUPPORT=TRUE

      - name: Build
        run: cmake --build build --parallel

      - name: Verify Android ELF
        run: |
          file build/igel
          readelf -h build/igel | grep -E "Class:|Machine:|Type:"
          readelf -d build/igel | grep NEEDED || true
          if readelf -d build/igel | grep -q "libc++_shared"; then
            echo "ERROR: libc++_shared dependency found; binary must be self-contained"
            exit 1
          fi

          MACHINE="$(readelf -h build/igel | sed -n 's/^  Machine:[[:space:]]*//p')"
          echo "Machine: $MACHINE"
          echo "$MACHINE" | grep -q "AArch64"

      - name: Verify build output
        run: |
          test -x build/igel
          ls -lh build/igel

      - name: Package single binary
        run: |
          mkdir -p artifact
          cp build/igel artifact/Igel-android-arm64-neon
          chmod +x artifact/Igel-android-arm64-neon

      - name: Upload Android ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: Igel-android-arm64-neon
          path: artifact/Igel-android-arm64-neon
          if-no-files-found: error
