name: Igel Android ARM64 NEON

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      ANDROID_API: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -perm -111 \
            | sort \
            | tail -1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" \
            >> "$GITHUB_ENV"

      - name: Verify Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          test -d "$ANDROID_NDK"

          NDK_BIN="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$NDK_BIN/aarch64-linux-android${ANDROID_API}-clang"
          test -x "$NDK_BIN/aarch64-linux-android${ANDROID_API}-clang++"

          "$NDK_BIN/aarch64-linux-android${ANDROID_API}-clang" \
            --version

          "$NDK_BIN/aarch64-linux-android${ANDROID_API}-clang++" \
            --version

          test -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake"

          echo "Android NDK:"
          echo "$ANDROID_NDK"

          echo "Android CMake toolchain:"
          echo "$ANDROID_NDK/build/cmake/android.toolchain.cmake"

      - name: Download Igel NNUE
        shell: bash
        run: |
          set -euxo pipefail

          curl -L \
            --fail \
            --retry 5 \
            --retry-all-errors \
            -o network_file \
            https://github.com/vshcherbyna/igel/releases/download/0.8/6b953e78.standard

          test -s network_file

          ls -lh network_file

      - name: Android compatibility patch
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("src/nnue.cpp")
          s = p.read_text()

          old = """#if defined(_WIN32)
              void * raw = _aligned_malloc(bytes, HugePage);
          #else
              void * raw = std::aligned_alloc(HugePage, bytes);
          #endif
          """

          new = """#if defined(_WIN32)
              void * raw = _aligned_malloc(bytes, HugePage);
          #elif defined(__ANDROID__)
              void * raw = nullptr;
              if (posix_memalign(&raw, HugePage, bytes) != 0)
                  raw = nullptr;
          #else
              void * raw = std::aligned_alloc(HugePage, bytes);
          #endif
          """

          if old in s:
              s = s.replace(old, new)

          elif "std::aligned_alloc(HugePage, bytes)" in s:
              s = s.replace(
                  "void * raw = std::aligned_alloc(HugePage, bytes);",
                  """void * raw = nullptr;
          #if defined(__ANDROID__)
              if (posix_memalign(&raw, HugePage, bytes) != 0)
                  raw = nullptr;
          #else
              raw = std::aligned_alloc(HugePage, bytes);
          #endif"""
              )

          else:
              raise SystemExit(
                  "Could not locate aligned_alloc code in src/nnue.cpp"
              )

          p.write_text(s)
          PY

          grep -n -A12 -B4 "posix_memalign" src/nnue.cpp

      - name: Create explicit Android toolchain
        shell: bash
        run: |
          set -euxo pipefail

          cat > android-toolchain.cmake <<EOF
          set(CMAKE_SYSTEM_NAME Android)
          set(CMAKE_SYSTEM_VERSION ${ANDROID_API})
          set(CMAKE_ANDROID_ARCH_ABI arm64-v8a)
          set(CMAKE_ANDROID_NDK "$ANDROID_NDK")
          set(CMAKE_ANDROID_STL_TYPE c++_static)

          set(CMAKE_C_COMPILER
              "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang")

          set(CMAKE_CXX_COMPILER
              "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++")

          set(CMAKE_C_FLAGS_INIT
              "-march=armv8-a+simd")

          set(CMAKE_CXX_FLAGS_INIT
              "-march=armv8-a+simd -O3 -fno-exceptions -fno-rtti")
          EOF

          cat android-toolchain.cmake

      - name: Configure Igel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build-android

          cmake \
            -S . \
            -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/android-toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DEVALFILE="$GITHUB_WORKSPACE/network_file" \
            -DUSE_NEON=ON

          echo
          echo "===== CMake compiler information ====="

          grep -E \
            'CMAKE_(C|CXX)_COMPILER:FILEPATH|CMAKE_SYSTEM_NAME|CMAKE_SYSTEM_PROCESSOR|CMAKE_ANDROID_ARCH_ABI' \
            build-android/CMakeCache.txt \
            || true

          echo
          echo "===== CMake compiler path ====="

          grep -E \
            'CMAKE_(C|CXX)_COMPILER:' \
            build-android/CMakeCache.txt \
            || true

      - name: Verify CMake selected Android compiler
        shell: bash
        run: |
          set -euxo pipefail

          C_COMPILER="$(
            grep '^CMAKE_C_COMPILER:FILEPATH=' \
              build-android/CMakeCache.txt \
              | cut -d= -f2-
          )"

          CXX_COMPILER="$(
            grep '^CMAKE_CXX_COMPILER:FILEPATH=' \
              build-android/CMakeCache.txt \
              | cut -d= -f2-
          )"

          echo "C compiler:"
          echo "$C_COMPILER"

          echo "C++ compiler:"
          echo "$CXX_COMPILER"

          case "$C_COMPILER" in
            *aarch64-linux-android*)
              ;;
            *)
              echo "ERROR: CMake selected a non-Android C compiler:"
              echo "$C_COMPILER"
              exit 1
              ;;
          esac

          case "$CXX_COMPILER" in
            *aarch64-linux-android*)
              ;;
            *)
              echo "ERROR: CMake selected a non-Android C++ compiler:"
              echo "$CXX_COMPILER"
              exit 1
              ;;
          esac

          SYSTEM_NAME="$(
            grep '^CMAKE_SYSTEM_NAME:' \
              build-android/CMakeCache.txt \
              | cut -d= -f2-
          )"

          echo "CMAKE_SYSTEM_NAME=$SYSTEM_NAME"

          if [ "$SYSTEM_NAME" != "Android" ]; then
            echo "ERROR: CMake is not configured for Android."
            exit 1
          fi

      - name: Build Igel
        shell: bash
        run: |
          set -euxo pipefail

          cmake --build build-android \
            --parallel "$(nproc)" \
            --verbose

      - name: Locate engine
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== Built executable files ====="

          find build-android \
            -type f \
            -perm -111 \
            -print

          BINARY="$(
            find build-android \
              -type f \
              -perm -111 \
              ! -name '*.so' \
              ! -name '*.a' \
              | head -1
          )"

          if [ -z "$BINARY" ]; then
            echo "ERROR: Could not find Igel executable."
            exit 1
          fi

          echo "Selected binary:"
          echo "$BINARY"

          cp "$BINARY" Igel-android-arm64-neon
          chmod +x Igel-android-arm64-neon

      - name: Verify ARM64 Android binary
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== file ====="

          file Igel-android-arm64-neon

          echo
          echo "===== readelf ====="

          readelf -h Igel-android-arm64-neon

          echo
          echo "===== Architecture verification ====="

          MACHINE="$(
            readelf -h Igel-android-arm64-neon \
              | awk -F: '/Machine:/ {gsub(/^[ \t]+/, "", $2); print $2}'
          )"

          echo "Machine: $MACHINE"

          if ! echo "$MACHINE" | grep -qi 'AArch64'; then
            echo "ERROR: Binary is NOT AArch64."
            exit 1
          fi

          echo "SUCCESS: Binary is AArch64."

          echo
          echo "===== Android ELF check ====="

          readelf -l Igel-android-arm64-neon \
            | grep -E 'INTERP|Requesting program interpreter' \
            || true

      - name: Check dynamic dependencies
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== Dynamic section ====="

          readelf -d Igel-android-arm64-neon || true

          if readelf -d Igel-android-arm64-neon 2>/dev/null \
              | grep -q 'libc++_shared.so'; then
            echo "ERROR: Binary requires libc++_shared.so"
            exit 1
          fi

          echo "No libc++_shared.so dependency detected."

      - name: Check NEON instructions
        shell: bash
        run: |
          set -euxo pipefail

          NDK_LLVM="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          "$NDK_LLVM/llvm-objdump" \
            -d \
            Igel-android-arm64-neon \
            > disassembly.txt

          echo "===== Searching for AArch64 SIMD/NEON instructions ====="

          if grep -Eq \
            '\b(addv|addp|sqadd|sqdml|smull|umull|fmla|ld1|st1|tbl|zip[12]|uzp[12]|ext)\b' \
            disassembly.txt; then

            echo "NEON/SIMD instructions detected."
          else
            echo "WARNING: No obvious NEON instructions detected."
          fi

      - name: Show binary information
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== Final binary ====="

          ls -lh Igel-android-arm64-neon

          echo
          echo "===== file ====="

          file Igel-android-arm64-neon

          echo
          echo "===== ELF header ====="

          readelf -h Igel-android-arm64-neon

      - name: Package single binary
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf artifact
          mkdir -p artifact

          cp Igel-android-arm64-neon \
            artifact/Igel-android-arm64-neon

          echo "Artifact contents:"
          find artifact \
            -maxdepth 1 \
            -type f \
            -printf '%f\n'

      - name: Upload Igel ARM64 NEON
        uses: actions/upload-artifact@v4
        with:
          name: Igel-android-arm64-neon
          path: artifact/Igel-android-arm64-neon
          if-no-files-found: error
