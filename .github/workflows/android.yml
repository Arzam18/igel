name: Build Igel for Android (ARM64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build wget

      - name: Fetch NNUE Weights
        run: |
          mkdir -p weights
          wget -q https://raw.githubusercontent.com/vslavov/igel/master/weights/6b953e78.standard -O weights/6b953e78.standard || true

      - name: Configure CMake
        run: |
          cmake -B build_arm64 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Binary
        run: |
          cmake --build build_arm64 --config Release

      - name: Prepare Artifact
        run: |
          mkdir -p output
          cp build_arm64/igel* output/igel-android-arm64-v8a || true

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: igel-android-arm64-v8a
          path: output/
