name: Build Igel for Android (ARM64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build wget

      - name: Fetch NNUE Weights
        run: |
          mkdir -p weights
          wget -q https://raw.githubusercontent.com/vslavov/igel/master/weights/6b953e78.standard -O weights/6b953e78.standard || true

      - name: Patch for ARM64 Cross-Compilation
        run: |
          # 1. Download sse2neon to translate x86 SSE/AVX intrinsics to ARM NEON
          wget -q https://raw.githubusercontent.com/DLu/sse2neon/master/sse2neon.h -O src/sse2neon.h

          # 2. Replace x86 header inclusions with sse2neon on ARM targets
          find src/ -type f \( -name "*.h" -o -name "*.cpp" \) -exec sed -i \
            's/#include <immintrin.h>/#if defined(__aarch64__) || defined(__arm__)\n#include "sse2neon.h"\n#else\n#include <immintrin.h>\n#endif/g' {} +

          find src/ -type f \( -name "*.h" -o -name "*.cpp" \) -exec sed -i \
            's/#include <x86intrin.h>/#if defined(__aarch64__) || defined(__arm__)\n#include "sse2neon.h"\n#else\n#include <x86intrin.h>\n#endif/g' {} +

          # 3. Strip x86-specific compiler flags from CMakeLists.txt
          sed -i 's/-march=native//g' CMakeLists.txt
          sed -i 's/-mavx2//g' CMakeLists.txt
          sed -i 's/-msse[^ ]*//g' CMakeLists.txt
          sed -i -E 's/-fuse-ld=[^ ]*//g' CMakeLists.txt

      - name: Configure CMake
        run: |
          cmake -B build_arm64 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Binary
        run: |
          cmake --build build_arm64 --config Release

      - name: Prepare Artifact
        run: |
          mkdir -p output
          cp build_arm64/igel* output/igel-android-arm64-v8a || true

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: igel-android-arm64-v8a
          path: output/
