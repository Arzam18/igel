
name: Build Igel 3.8.10 Android ARM64

on:
  workflow_dispatch:
    inputs:
      network_url:
        description: "Igel NNUE network download URL"
        required: true
        type: string
        default: "https://github.com/vshcherbyna/igel/releases/download/0.8/820573bc.universal"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NEON
            build_dir: build-NEON
            march: armv8-a+simd
            dotprod: "OFF"
            artifact: igel-3.8.10-android-arm64-neon

          - name: NEON-Dotprod
            build_dir: build-NEON-Dotprod
            march: armv8.2-a+dotprod
            dotprod: "ON"
            artifact: igel-3.8.10-android-arm64-dotprod

    env:
      ANDROID_API: 24
      NDK_VERSION: r27c
      NDK_REVISION: "27.2.12479018"
      NDK_SHA1: "090e8083a715fdb1a3e402d0763c388abb03fb4e"

    steps:
      - name: Checkout Igel 3.8.10 source
        uses: actions/checkout@v4
        with:
          repository: Arzam18/igel
          ref: 724dc284d2d3553846a40c7d74c1551474ddd625
          fetch-depth: 1

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            unzip \
            curl \
            file \
            binutils

      - name: Download and install Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail

          NDK_ARCHIVE="$RUNNER_TEMP/android-ndk-r27c-linux.zip"
          NDK_URL="https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"

          curl -fL --retry 3 --retry-delay 2 \
            "$NDK_URL" \
            -o "$NDK_ARCHIVE"

          echo "${NDK_SHA1}  ${NDK_ARCHIVE}" | sha1sum --check -

          mkdir -p "$RUNNER_TEMP/android-ndk"
          unzip -q "$NDK_ARCHIVE" -d "$RUNNER_TEMP/android-ndk"

          NDK_PATH="$RUNNER_TEMP/android-ndk/android-ndk-r27c"

          NDK_BIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NDK_COMPILER="$NDK_BIN/aarch64-linux-android24-clang++"

          if [[ ! -x "$NDK_COMPILER" ]]; then
            echo "ERROR: Android API 24 target compiler not found."
            echo "Expected: $NDK_COMPILER"
            find "$RUNNER_TEMP/android-ndk" -maxdepth 4 -type f -name 'clang++'
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "$NDK_BIN" >> "$GITHUB_PATH"

          echo "Android NDK r27c installed successfully."
          "$NDK_PATH/ndk-build" --version

      - name: Verify Igel source and ARM64 implementations
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Igel version ====="

          grep -Fq 'const std::string VERSION = "3.8.10" IGEL_BUILD_DATE;' src/uci.cpp

          echo "Igel 3.8.10 source identity confirmed."

          echo "===== ARM64 NEON implementation ====="

          grep -Fq '"ARM64 NEON"' src/uci.cpp
          grep -Fq '#include <arm_neon.h>' src/nnue.cpp
          grep -Fq 'inline int32x4_t affine_acc_neon' src/nnue.cpp

          echo "ARM64 NEON implementation confirmed."

          echo "===== DotProd implementation ====="

          grep -Fq 'vdotq_s32' src/nnue.cpp
          grep -Fq '" DOTPROD"' src/uci.cpp

          echo "DotProd implementation confirmed."

      - name: Download NNUE network
        shell: bash
        env:
          NETWORK_URL: ${{ inputs.network_url }}
        run: |
          set -euo pipefail

          test -n "$NETWORK_URL"

          curl -fL --retry 3 --retry-delay 2 \
            "$NETWORK_URL" \
            -o "$GITHUB_WORKSPACE/network_file"

          test -s "$GITHUB_WORKSPACE/network_file"

          echo "===== NNUE network information ====="

          ls -lh "$GITHUB_WORKSPACE/network_file"
          sha256sum "$GITHUB_WORKSPACE/network_file" | tee network.sha256

      - name: Configure Android ARM64 ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail

          NDK_TOOLCHAIN="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"

          test -f "$NDK_TOOLCHAIN"

          cmake \
            -S . \
            -B "${{ matrix.build_dir }}" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DEVALFILE="$GITHUB_WORKSPACE/network_file" \
            -D_BTYPE=0 \
            -DUSE_DOTPROD=${{ matrix.dotprod }} \
            -DCMAKE_C_FLAGS="-march=${{ matrix.march }} -mtune=cortex-a76" \
            -DCMAKE_CXX_FLAGS="-march=${{ matrix.march }} -mtune=cortex-a76"

      - name: Verify compiler configuration
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="${{ matrix.build_dir }}"
          COMPILE_COMMANDS="$BUILD_DIR/compile_commands.json"
          CMAKE_CACHE="$BUILD_DIR/CMakeCache.txt"

          test -s "$COMPILE_COMMANDS"
          test -s "$CMAKE_CACHE"

          echo "===== NDK C++ compiler ====="

          NDK_CLANGXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"

          test -x "$NDK_CLANGXX"

          if ! grep -Fq "$NDK_CLANGXX" "$CMAKE_CACHE"; then
            echo "ERROR: CMake is not configured with the expected NDK clang++."
            grep -E 'CMAKE_CXX_COMPILER:|CMAKE_C_COMPILER:' "$CMAKE_CACHE" || true
            exit 1
          fi

          echo "NDK clang++ compiler confirmed:"
          echo "$NDK_CLANGXX"

          echo "===== NEON compiler definition ====="

          grep -Fq -- '-DUSE_NEON=1' "$COMPILE_COMMANDS"

          echo "USE_NEON=1 confirmed."

          echo "===== DotProd compiler definition ====="

          if [[ "${{ matrix.dotprod }}" == "ON" ]]; then
            grep -Fq -- '-DUSE_DOTPROD=1' "$COMPILE_COMMANDS"
            echo "USE_DOTPROD=1 confirmed."
          else
            if grep -Fq -- '-DUSE_DOTPROD=1' "$COMPILE_COMMANDS"; then
              echo "ERROR: DOTPROD unexpectedly enabled in baseline NEON build."
              exit 1
            fi

            echo "Baseline NEON correctly excludes USE_DOTPROD."
          fi

          echo "===== Architecture compiler flags ====="

          grep -Fq -- "-march=${{ matrix.march }}" "$COMPILE_COMMANDS"
          grep -Fq -- "-mtune=cortex-a76" "$COMPILE_COMMANDS"

          echo "Architecture flags confirmed:"
          echo "-march=${{ matrix.march }}"
          echo "-mtune=cortex-a76"

      - name: Build Igel
        shell: bash
        run: |
          set -euo pipefail

          cmake --build "${{ matrix.build_dir }}" \
            --target igel \
            --parallel "$(nproc)"

          test -s "${{ matrix.build_dir }}/igel"

      - name: Verify Android ARM64 binary
        shell: bash
        run: |
          set -euo pipefail

          BIN="${{ matrix.build_dir }}/igel"

          echo "===== Binary information ====="

          file "$BIN"

          readelf -h "$BIN" | grep -F 'ELF64'
          readelf -h "$BIN" | grep -F 'AArch64'
          readelf -l "$BIN" | grep -F '/system/bin/linker64'

          if readelf -d "$BIN" | grep -Fq 'libc++_shared.so'; then
            echo "ERROR: Binary depends on libc++_shared.so."
            exit 1
          fi

          echo "Android ARM64 ELF verification passed."

      - name: Verify UCI identity and Android build configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Source UCI identity ====="

          grep -Fq 'const std::string VERSION = "3.8.10" IGEL_BUILD_DATE;' src/uci.cpp
          grep -Fq '"ARM64 NEON"' src/uci.cpp
          grep -Fq '" DOTPROD"' src/uci.cpp
          grep -Fq 'std::cout << "id name " << PROGRAM_NAME << " " << VERSION << ARCHITECTURE' src/uci.cpp

          echo "Igel 3.8.10 UCI identity is present in source."

          echo "===== Compiler definitions ====="

          COMPILE_COMMANDS="${{ matrix.build_dir }}/compile_commands.json"

          grep -Fq -- '-DUSE_NEON=1' "$COMPILE_COMMANDS"

          if [[ "${{ matrix.dotprod }}" == "ON" ]]; then
            grep -Fq -- '-DUSE_DOTPROD=1' "$COMPILE_COMMANDS"
            echo "NEON and DOTPROD definitions confirmed."
          else
            if grep -Fq -- '-DUSE_DOTPROD=1' "$COMPILE_COMMANDS"; then
              echo "ERROR: Baseline NEON build unexpectedly has DOTPROD enabled."
              exit 1
            fi

            echo "Baseline NEON compiler definition confirmed."
          fi

          echo "===== Android ARM64 ELF verification ====="

          BIN="${{ matrix.build_dir }}/igel"

          test -s "$BIN"
          file "$BIN"

          readelf -h "$BIN" | grep -E 'Class:.*ELF64'
          readelf -h "$BIN" | grep -E 'Machine:.*AArch64'
          readelf -l "$BIN" | grep -F '/system/bin/linker64'

          if readelf -d "$BIN" | grep -Fq 'libc++_shared.so'; then
            echo "ERROR: Binary depends on libc++_shared.so."
            exit 1
          fi

          echo "Android ARM64 checks passed."

      - name: Verify generated ARM64 instructions
        shell: bash
        run: |
          set -euo pipefail

          BIN="${{ matrix.build_dir }}/igel"
          OBJDUMP="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          DISASSEMBLY="${{ matrix.build_dir }}/disassembly.txt"

          test -x "$OBJDUMP"

          "$OBJDUMP" -d "$BIN" > "$DISASSEMBLY"

          echo "===== ARM64 instruction verification ====="

          if [[ "${{ matrix.dotprod }}" == "ON" ]]; then
            if ! grep -Eiq '[[:space:]]sdot[[:space:]]' "$DISASSEMBLY"; then
              echo "ERROR: SDOT instruction not found in DotProd binary."
              exit 1
            fi

            echo "SDOT instruction confirmed."
          else
            if grep -Eiq '[[:space:]]sdot[[:space:]]' "$DISASSEMBLY"; then
              echo "ERROR: SDOT unexpectedly found in baseline NEON binary."
              exit 1
            fi

            echo "No SDOT instruction in baseline NEON binary."

            if ! grep -Eiq '\b(add|sub|smax|smin|smull|smlal|sqadd|sqsub)[[:alnum:]]*[[:space:]]+v[0-9]+\.' "$DISASSEMBLY"; then
              echo "ERROR: Expected ARM NEON vector arithmetic was not found."
              exit 1
            fi

            echo "ARM NEON vector instructions confirmed."
          fi

      - name: Prepare engine-only artifact
        shell: bash
        run: |
          set -euo pipefail

          BIN="${{ matrix.build_dir }}/igel"
          STAGING="${{ matrix.build_dir }}/artifact"

          mkdir -p "$STAGING"

          cp "$BIN" "$STAGING/igel"
          cp network.sha256 "$STAGING/nnue-network.sha256"

          (
            cd "$STAGING"
            sha256sum igel > SHA256SUMS.txt
          )

          cat > "$STAGING/build-info.txt" <<EOF
          Engine: Igel
          Version: 3.8.10
          Target: Android
          ABI: arm64-v8a
          Android API: ${ANDROID_API}
          NDK: ${NDK_VERSION} (${NDK_REVISION})
          Build variant: ${{ matrix.name }}
          Architecture flags: -march=${{ matrix.march }} -mtune=cortex-a76
          USE_NEON: enabled
          USE_DOTPROD: ${{ matrix.dotprod }}
          Source commit: 724dc284d2d3553846a40c7d74c1551474ddd625
          EOF

          echo "===== Artifact contents ====="
          ls -lh "$STAGING"

      - name: Upload ${{ matrix.name }} engine
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.build_dir }}/artifact/
          if-no-files-found: error
          compression-level: 9
