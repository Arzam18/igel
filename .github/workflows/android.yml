name: Igel 3.8.7b Android ARM64 NEON and Dotprod

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'ANDROID-ARM64-PORT-3.8.7b.md'
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'ANDROID-ARM64-PORT-3.8.7b.md'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      ANDROID_API: 24
      NETWORK_FILE: network_file
      NETWORK_URL: https://github.com/vshcherbyna/igel/releases/download/0.8/820573bc.universal

    steps:
      - name: Checkout Igel 3.8.7b source
        uses: actions/checkout@v4

      - name: Install Android SDK components and NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${ANDROID_NDK_VERSION}"

          NDK_PATH="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          test -x "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
          test -x "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++"
          test -x "$TOOLCHAIN/bin/llvm-objdump"
          test -x "$TOOLCHAIN/bin/llvm-readelf"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "ANDROID_CXX=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"
          echo "ANDROID_OBJDUMP=$TOOLCHAIN/bin/llvm-objdump" >> "$GITHUB_ENV"
          echo "ANDROID_READELF=$TOOLCHAIN/bin/llvm-readelf" >> "$GITHUB_ENV"

      - name: Verify Android AArch64 toolchain
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_CXX" --version
          TARGET="$("$ANDROID_CXX" -dumpmachine)"
          echo "Compiler target: $TARGET"
          [[ "$TARGET" =~ ^aarch64-(unknown-)?linux-android ]]

      - name: Download and verify Igel 3.8.7b universal NNUE
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --retry-delay 2 --connect-timeout 20 \
            "$NETWORK_URL" -o "$NETWORK_FILE"
          test -s "$NETWORK_FILE"
          echo "Downloaded network: $(stat -c '%n %s bytes' "$NETWORK_FILE")"
          echo "Network SHA-256: $(sha256sum "$NETWORK_FILE" | awk '{print $1}')"

      - name: Configure and build portable ARM64 NEON binary
        shell: bash
        run: |
          # Trace every command: if CMake configuration or compilation fails,
          # the Actions log identifies the exact failing command.
          set -euxo pipefail
          BUILD_DIR=build-android-neon
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DEVALFILE="$GITHUB_WORKSPACE/$NETWORK_FILE" \
            -DUSE_NEON=ON \
            -DUSE_DOTPROD=OFF \
            -D_BTYPE=0 \
            -DSYZYGY_SUPPORT=TRUE

          echo "--- CMake Android/ABI/compiler configuration ---"
          grep -E '^(CMAKE_SYSTEM_NAME|CMAKE_SYSTEM_VERSION|CMAKE_CXX_COMPILER|CMAKE_ANDROID_ARCH_ABI|ANDROID_ABI|ANDROID_PLATFORM):' "$BUILD_DIR/CMakeCache.txt" || true
          echo "--- Ninja compiler command (diagnostic only) ---"
          grep -m 3 -E 'clang\+\+|CXX_COMPILER' "$BUILD_DIR/build.ninja" || true

          # Let the Android toolchain file control the selected Clang driver.
          # The NDK CMake toolchain commonly records generic clang++ rather
          # than the API-specific wrapper; the final ELF checks below verify
          # the produced binary's actual AArch64 Android ABI.
          cmake --build "$BUILD_DIR" --target igel --parallel "$(nproc)" --verbose 2>&1 | tee "$BUILD_DIR/build.log"
          test -s "$BUILD_DIR/igel"

      - name: Verify portable ARM64 NEON binary
        shell: bash
        run: |
          set -euo pipefail
          BIN=build-android-neon/igel
          file "$BIN"
          "$ANDROID_READELF" -h "$BIN" | tee build-android-neon/elf-header.txt
          grep -q 'AArch64' build-android-neon/elf-header.txt
          "$ANDROID_READELF" -l "$BIN" | tee build-android-neon/program-headers.txt
          grep -q '/system/bin/linker64' build-android-neon/program-headers.txt
          if "$ANDROID_READELF" -d "$BIN" 2>/dev/null | grep -q 'libc++_shared.so'; then
            echo "ERROR: binary requires libc++_shared.so"
            exit 1
          fi
          "$ANDROID_OBJDUMP" -d "$BIN" > build-android-neon/igel.disassembly.txt
          grep -Eiq '\b(saddlp|sadalp|smull|umull|sqxtn|smin|smax|mul|ld1|st1)\b' build-android-neon/igel.disassembly.txt

      - name: Configure and build ARM64 Dotprod SDOT binary
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_DIR=build-android-dotprod
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DEVALFILE="$GITHUB_WORKSPACE/$NETWORK_FILE" \
            -DUSE_NEON=ON \
            -DUSE_DOTPROD=ON \
            -D_BTYPE=0 \
            -DSYZYGY_SUPPORT=TRUE

          echo "--- CMake Android/ABI/compiler configuration ---"
          grep -E '^(CMAKE_SYSTEM_NAME|CMAKE_SYSTEM_VERSION|CMAKE_CXX_COMPILER|CMAKE_ANDROID_ARCH_ABI|ANDROID_ABI|ANDROID_PLATFORM):' "$BUILD_DIR/CMakeCache.txt" || true
          echo "--- Ninja compiler/SDOT flags (diagnostic only) ---"
          grep -m 8 -E 'clang\+\+|CXX_COMPILER|USE_DOTPROD|armv8.2-a\+dotprod' "$BUILD_DIR/build.ninja" || true

          # USE_DOTPROD enables vdotq_s32 in nnue.cpp and CMake adds
          # -march=armv8.2-a+dotprod. The source-level feature guard and
          # post-link SDOT disassembly check are authoritative; do not fail
          # early on fragile text matches in generated CMake/Ninja files.
          cmake --build "$BUILD_DIR" --target igel --parallel "$(nproc)" --verbose 2>&1 | tee "$BUILD_DIR/build.log"
          test -s "$BUILD_DIR/igel"

      - name: Verify ARM64 Dotprod SDOT binary
        shell: bash
        run: |
          set -euo pipefail
          BIN=build-android-dotprod/igel
          file "$BIN"
          "$ANDROID_READELF" -h "$BIN" | tee build-android-dotprod/elf-header.txt
          grep -q 'AArch64' build-android-dotprod/elf-header.txt
          "$ANDROID_READELF" -l "$BIN" | tee build-android-dotprod/program-headers.txt
          grep -q '/system/bin/linker64' build-android-dotprod/program-headers.txt
          if "$ANDROID_READELF" -d "$BIN" 2>/dev/null | grep -q 'libc++_shared.so'; then
            echo "ERROR: binary requires libc++_shared.so"
            exit 1
          fi
          "$ANDROID_OBJDUMP" -d "$BIN" > build-android-dotprod/igel.disassembly.txt
          if ! grep -Eiq '\bsdot\b' build-android-dotprod/igel.disassembly.txt; then
            echo "ERROR: Dotprod build contains no SDOT instructions"
            exit 1
          fi

      - name: Package engine-only binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp build-android-neon/igel artifact/Igel-3.8.7b-android-arm64-neon
          cp build-android-dotprod/igel artifact/Igel-3.8.7b-android-arm64-dotprod
          chmod +x artifact/Igel-3.8.7b-android-arm64-*
          sha256sum artifact/Igel-3.8.7b-android-arm64-* > artifact/SHA256SUMS.txt
          ls -lh artifact

      - name: Upload Igel 3.8.7b Android ARM64 NEON and Dotprod
        uses: actions/upload-artifact@v4
        with:
          name: Igel-3.8.7b-android-arm64-neon-dotprod
          path: artifact/*
          if-no-files-found: error
